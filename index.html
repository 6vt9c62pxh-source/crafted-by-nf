<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta property="og:title" content="Crafted by N.F." />
  <meta property="og:description" content="Instagram, TikTok & Kontakt" />
  <meta property="og:image" content="https://craftedbynf.de/logo.jpg" />
  <meta property="og:url" content="https://craftedbynf.de" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Crafted by N.F." />
  <meta name="twitter:description" content="Instagram, TikTok & Kontakt" />
  <meta name="twitter:image" content="https://craftedbynf.de/logo.jpg" />

  <title>crafted_by_nf</title>
  <meta name="description" content="Instagram-Profil crafted_by_nf" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #c8deb6;
      color: #111;
    }

    .card {
      width: min(100%, 460px);
      padding: 34px 32px 30px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e7ded6;
      border-radius: 32px;
      box-shadow: 0 28px 80px rgba(80, 60, 45, 0.16);
    }

    .logo {
      width: clamp(220px, 55vw, 300px);
      height: clamp(220px, 55vw, 300px);
      margin: 0 auto 18px;
      display: block;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -1.4px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      min-height: 58px;
      padding: 0 36px;
      border-radius: 999px;
      background: #BFC3C7;
      color: #ffffff;
      font-size: clamp(19px, 5vw, 23px);
      font-weight: 800;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18),
                  0 12px 26px rgba(0,0,0,0.16);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18),
                  0 16px 34px rgba(0,0,0,0.22);
      outline: none;
    }

    .footer-links {
      margin-top: 25px;
      font-size: 14px;
    }

    .footer-links a {
      color: #666;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .card {
        width: 100%;
        max-width: 380px;
        padding: 28px 22px 26px;
        border-radius: 28px;
      }

      .button {
        min-height: 54px;
        padding: 0 30px;
      }
    }
  </style>
</head>

<body>

<main class="card">

  <img class="logo" src="logo.png" alt="crafted_by_nf Logo" />

  <h1>Crafted by N.F.</h1>

  <div class="button-group">

    <a class="button"
       href="https://www.instagram.com/crafted_by_nf/"
       target="_blank"
       rel="noopener noreferrer">
      Instagram
    </a>

    <a class="button"
       href="https://www.tiktok.com/@crafted_by_nf?_r=1&_t=ZG-96PnfqFxGld"
       target="_blank"
       rel="noopener noreferrer">
      TikTok
    </a>

    <a class="button"
       href="mailto:mail@craftedbynf.de">
      Mail senden
    </a>

  </div>

<div class="footer-links">
  <a href="impressum.html">Impressum</a>
  |
  <a href="datenschutz.html">Datenschutz</a>
  |
  <a href="pflegehinweise.html">Sicherheits- & Pflegehinweise</a>
</div>

</main>

</body>
</html>
