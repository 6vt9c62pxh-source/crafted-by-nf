<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>crafted_by_nf</title>
  <meta name="description" content="Instagram-Profil crafted_by_nf" />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at center, #ffffff 0%, #f5eee8 45%, #ebe2da 100%);
      color: #111;
    }

    .card {
      width: min(100%, 460px);
      padding: 34px 32px 30px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e7ded6;
      border-radius: 32px;
      box-shadow: 0 28px 80px rgba(80, 60, 45, 0.16);
    }

  .logo {
      width: clamp(220px, 55vw, 300px);
      height: clamp(220px, 55vw, 300px);
      margin: 0 auto 18px;
      display: block;
      object-fit: contain;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(30px, 8vw, 44px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -1.4px;
      word-break: keep-all;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      min-height: 58px;
      padding: 0 36px;
      border-radius: 999px;
      background: #BFC3C7;
      color: #ffffff;
      font-size: clamp(19px, 5vw, 23px);
      font-weight: 800;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 12px 26px rgba(0,0,0,0.16);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 16px 34px rgba(0,0,0,0.22);
      outline: none;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .card {
        width: 100%;
        max-width: 380px;
        padding: 28px 22px 26px;
        border-radius: 28px;
      }

      .logo {
        margin-bottom: 10px;
      }

      h1 {
        margin-bottom: 18px;
        letter-spacing: -1px;
      }

      .button {
        min-height: 54px;
        padding: 0 30px;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding: 24px 18px 22px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="crafted_by_nf Logo" />

    <h1>@crafted_by_nf</h1>
<div class="button-group">

  <a class="button" href="https://www.instagram.com/crafted_by_nf/" target="_blank" rel="noopener noreferrer">

    Instagram

  </a>

  <a class="button" href="https://www.tiktok.com/@crafted_by_nf?_r=1&_t=ZG-96PnfqFxGld" target="_blank" rel="noopener noreferrer">

    TikTok

  </a>

  <a class="button" href="mailto:mail@craftedbynf.de">

    Mail senden

  </a>

</div>
   
  </main>
</body>
</html>
