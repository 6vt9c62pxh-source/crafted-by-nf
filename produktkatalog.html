
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Produktkatalog | Crafted by N.F.</title>
  <meta name="description"
        content="Entdecke die handgemachten Produkte von Crafted by N.F.">

  <meta name="theme-color" content="#c8deb6">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #c8deb6;
      color: #111;
    }

    .card {
      width: min(100%, 1000px);
      margin: 0 auto;
      padding: 24px;
      background: #ffffff;
      border: 1px solid #e7ded6;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(80, 60, 45, 0.12);
    }

    .logo {
      width: 180px;
      display: block;
      margin: 0 auto 20px;
    }

    h1 {
      text-align: center;
      margin: 0 0 10px;
      font-size: clamp(26px, 5vw, 38px);
    }

    .intro {
      text-align: center;
      color: #555;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    

.button-group {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
}

.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 320px;
  min-height: 58px;
  margin: 0;
  padding: 0 36px;
  border-radius: 999px;
  background: #BFC3C7;
  color: #ffffff;
  font-size: clamp(19px, 5vw, 23px);
  font-weight: 800;
  text-decoration: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18),
              0 12px 26px rgba(0,0,0,0.16);
  transition: transform 160ms ease, box-shadow 160ms ease;
}

.button:hover,
.button:focus-visible {
  transform: translateY(-2px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18),
              0 16px 34px rgba(0,0,0,0.22);
  outline: none;
}

@media (max-width: 600px) {
  .button {
    min-height: 54px;
    padding: 0 30px;
  }
}


      .card {
        padding: 16px;
        border-radius: 18px;
      }

      .logo {
        width: 85px;
        height: 85px;
      }

      .viewer {
        height: 68vh;
        min-height: 400px;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        min-height: 54px;
        padding: 0 30px;
      }
    }
  </style>
</head>

<body>
  <main class="card">

    <img class="logo" src="logo.png" alt="Crafted by N.F.">

    <h1>Produktkatalog</h1>

    <p class="intro">
      Entdecke meine handgemachten Produkte.
    </p>
    <iframe
      class="viewer"
      src="produktkatalog.pdf?v=1#view=FitH"
      title="Aktueller Produktkatalog von Crafted by N.F."
      loading="eager">
    </iframe>

    <p class="fallback">
      Falls der Katalog nicht angezeigt wird, nutze
      „Katalog separat öffnen“ oder „PDF herunterladen“.
    </p>

    <div class="button-group">
      <a
        class="button"
        href="produktkatalog.pdf?v=1"
        target="_blank"
        rel="noopener noreferrer">
        Katalog separat öffnen
      </a>

      <a
        class="button"
        href="produktkatalog.pdf?v=1"
        download="Crafted-by-NF-Produktkatalog.pdf">
        PDF herunterladen
      </a>
    </div>

    <a class="button" href="index.html">
      Zurück zur Startseite
    </a>

  </main>

  <script
    data-goatcounter="https://craftedbynf.goatcounter.com/count"
    async
    src="//gc.zgo.at/count.js">
  </script>
</body>
</html>
