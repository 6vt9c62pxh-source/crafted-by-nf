
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Produktkatalog | Crafted by N.F.</title>
  <meta name="description"
        content="Entdecke die handgemachten Produkte von Crafted by N.F.">

  <meta name="theme-color" content="#c8deb6">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #c8deb6;
      color: #111;
    }

    .card {
      width: min(100%, 1000px);
      padding: 34px 32px 30px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e7ded6;
      border-radius: 32px;
      box-shadow: 0 28px 80px rgba(80, 60, 45, 0.16);
    }

    .logo {
  width: clamp(220px, 55vw, 300px);
  height: clamp(220px, 55vw, 300px);
  margin: 0 auto 18px;
  display: block;
  object-fit: contain;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 38px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .intro {
      margin: 0 0 24px;
      color: #555;
      font-size: 17px;
      line-height: 1.5;
    }

    .viewer {
      display: block;
      width: 100%;
      height: 78vh;
      min-height: 500px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #f7f7f7;
    }

    .fallback {
      margin: 20px 0 0;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      margin-top: 20px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      min-height: 58px;
      margin: 0;
      padding: 0 36px;
      border: none;
      border-radius: 999px;
      background: #BFC3C7;
      color: #ffffff;
      font-size: clamp(19px, 5vw, 23px);
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 12px 26px rgba(0,0,0,0.16);
      transition: transform 160ms ease,
                  box-shadow 160ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 16px 34px rgba(0,0,0,0.22);
      outline: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
        display: block;
      }

      .card {
        width: 100%;
        padding: 28px 22px 26px;
        border-radius: 28px;
      }

      .logo {
        width: 85px;
        height: 85px;
        margin-bottom: 18px;
      }

      h1 {
        font-size: clamp(30px, 8vw, 38px);
      }

      .viewer {
        height: 68vh;
        min-height: 400px;
      }

      .button {
        min-height: 54px;
        padding: 0 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      class="logo"
      src="logo.png"
      alt="Crafted by N.F.">

    <h1>Produktkatalog</h1>

    <p class="intro">
      Entdecke meine handgemachten Produkte.
    </p>

    <iframe
      class="viewer"
      src="produktkatalog.pdf?v=1#view=FitH"
      title="Aktueller Produktkatalog von Crafted by N.F."
      loading="eager">
    </iframe>

    <p class="fallback">
      Falls der Katalog nicht angezeigt wird, nutze
      „Katalog separat öffnen“ oder „PDF herunterladen“.
    </p>

    <div class="button-group">

      <a
        class="button"
        href="produktkatalog.pdf?v=1"
        target="_blank"
        rel="noopener noreferrer">
        Katalog separat öffnen
      </a>

      <a
        class="button"
        href="produktkatalog.pdf?v=1"
        download="Crafted-by-NF-Produktkatalog.pdf">
        PDF herunterladen
      </a>

      <a
        class="button"
        href="index.html">
        Zurück zur Startseite
      </a>

    </div>

  </main>

  <script
    data-goatcounter="https://craftedbynf.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js">
  </script>

</body>
</html>
